# Routes: lb://<service-id> is resolved through Eureka + Spring Cloud LoadBalancer
spring.cloud.gateway.server.webmvc.routes[0].id=sim-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://sim-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/sim/**

spring.cloud.gateway.server.webmvc.routes[1].id=customer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/customer/**

spring.cloud.gateway.server.webmvc.routes[2].id=idproof-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://idproof-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/idproof/**

# Origins allowed to call the gateway from a browser (the static UI)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080

