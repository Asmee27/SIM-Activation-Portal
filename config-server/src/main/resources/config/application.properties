eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# file logging with trace ids (traceId stays blank until tracing is set up)
logging.file.name=logs/${spring.application.name}.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name}] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n

# JWT (HS256): the gateway issues tokens; the gateway AND every service verify them.
# Secret needs 32+ chars. In production this would come from a vault/env var, not a file.
app.jwt.secret=infytel-sim-activation-portal-dev-secret-key-2026
app.jwt.expiry-minutes=30
app.jwt.issuer=sim-activation-portal

# Dev-friendly discovery: services become routable within ~10s of starting instead of ~90s
# (defaults: 30s registry fetch + 35s load-balancer cache). Use defaults in production.
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
